<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo do Quadrado - Phaser.js</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 20px;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      #game-container {
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        line-height: 0;
      }

      .controls {
        font-size: 0.95rem;
        color: #94a3b8;
        text-align: center;
      }

      kbd {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 4px;
        background: #1e293b;
        border: 1px solid #334155;
        color: #f8fafc;
        font-family: inherit;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h1>Arena Quadrada</h1>
    <div id="game-container"></div>
    <p class="controls">
      Use <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> ou as
      <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> para mover o quadrado.
    </p>
    <script type="module" src="./main.js"></script>
  </body>
</html>
